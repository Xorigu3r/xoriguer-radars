# Paquets de mapa per regions (fitxers .pmtiles) per fer servir el mapa sense connexió a l'app.
# Es generen amb Planetiler (esquema OpenMapTiles, el mateix que OpenFreeMap, així l'estil hi encaixa)
# a partir dels extractes d'OpenStreetMap de Geofabrik, i es pengen a la Release "mapes".
# Cada mes s'actualitzen. També es pot llançar a mà, per a totes les regions o només algunes.
name: Paquets de mapa

on:
  schedule:
    - cron: '0 3 2 * *'          # el dia 2 de cada mes
  workflow_dispatch:
    inputs:
      regions:
        description: "Ids separats per comes (buit = totes). P. ex.: es-catalunya,ad-andorra"
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: mapes
  cancel-in-progress: false

env:
  PLANETILER: v0.10.2

jobs:
  llista:
    runs-on: ubuntu-latest
    outputs:
      matriu: ${{ steps.m.outputs.matriu }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          node -e '
            const all = require("./scripts/mapes-regions.json");
            const want = (process.env.REGIONS || "").split(",").map(s => s.trim()).filter(Boolean);
            const sel = want.length ? all.filter(r => want.includes(r.id)) : all;
            console.log("matriu=" + JSON.stringify(sel.map(r => ({ id: r.id, pbf: r.pbf }))));
          ' >> "$GITHUB_OUTPUT"
        env:
          REGIONS: ${{ github.event.inputs.regions }}
      - name: Crea la Release "mapes" si no existeix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mapes >/dev/null 2>&1 || gh release create mapes --prerelease --title "Paquets de mapa" \
            --notes "Mapes per regions per a Xoriguer Radars (fitxers .pmtiles, es descarreguen des de l'app). Dades © OpenStreetMap (ODbL), esquema OpenMapTiles."

  paquet:
    needs: llista
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6           # per no carregar massa Geofabrik
      matrix:
        regio: ${{ fromJSON(needs.llista.outputs.matriu) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Només les fonts comunes (mar, costes, llacs, Natural Earth). MAI el fitxer d'OSM de la regió:
      # el novembre de 2026 la memòria cau guardava el d'Andorra i totes les regions van sortir amb Andorra.
      - name: Fonts comunes (mar, costes, Natural Earth) en memòria cau
        uses: actions/cache@v4
        with:
          path: |
            data/sources
            !data/sources/*.osm.pbf
          key: planetiler-fonts-v2
      - name: Descarrega l'extracte d'OSM de la regió
        run: |
          rm -f data/sources/*.osm.pbf
          mkdir -p osm
          curl -sfL -o "osm/${{ matrix.regio.id }}.osm.pbf" "https://download.geofabrik.de/${{ matrix.regio.pbf }}-latest.osm.pbf"
          ls -la osm
      - name: Genera el paquet
        run: |
          curl -sL -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/${PLANETILER}/planetiler.jar"
          mkdir -p out
          java -Xmx12g -jar planetiler.jar --download \
            --osm-path="osm/${{ matrix.regio.id }}.osm.pbf" \
            --output="out/${{ matrix.regio.id }}.pmtiles" --maxzoom=14 --force
          ls -la out
      - name: Comprova que el paquet és de la regió correcta
        run: |
          node -e '
            const fs = require("fs");
            const id = process.argv[1];
            const b = Buffer.alloc(127); const fd = fs.openSync(`out/${id}.pmtiles`, "r"); fs.readSync(fd, b, 0, 127, 0);
            const e7 = (o) => b.readInt32LE(o) / 1e7;
            const [w, s, e, n] = [e7(102), e7(106), e7(110), e7(114)];
            const cx = (w + e) / 2, cy = (s + n) / 2;
            // Caixes aproximades per país (per detectar un paquet amb les dades d una altra regió)
            const box = { es: [-18.5, 27.5, 4.5, 44], ad: [1.3, 42.3, 1.9, 42.8], pt: [-31.5, 32, -6, 42.2], fr: [-5.5, 41.3, 9.7, 51.2], it: [6.5, 35.4, 18.6, 47.2] }[id.slice(0, 2)];
            const inBox = box && cx >= box[0] && cx <= box[2] && cy >= box[1] && cy <= box[3];
            const andorra = Math.abs(cx - 1.6) < 0.2 && Math.abs(cy - 42.54) < 0.2;
            console.log(id, "límits", [w, s, e, n].map(x => x.toFixed(3)).join(","));
            if (!inBox || (andorra && id !== "ad-andorra")) { console.error("ERROR: el paquet no és de la regió " + id); process.exit(1); }
          ' "${{ matrix.regio.id }}"
      - name: Puja'l a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload mapes "out/${{ matrix.regio.id }}.pmtiles" --clobber
      - name: Fitxa del paquet
        run: |
          mkdir -p peces
          node scripts/mapes-manifest.mjs --peca "out/${{ matrix.regio.id }}.pmtiles" > "peces/${{ matrix.regio.id }}.json"
          cat "peces/${{ matrix.regio.id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: peca-${{ matrix.regio.id }}
          path: peces/${{ matrix.regio.id }}.json

  llista-final:
    needs: paquet
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: peca-*
          path: peces
          merge-multiple: true
      - name: Actualitza www/mapes.json
        run: |
          node scripts/mapes-manifest.mjs --uneix peces
          if ! git diff --quiet www/mapes.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add www/mapes.json
            git commit -m "Actualitza la llista de paquets de mapa"
            git pull --rebase
            git push
          fi
      - name: Torna a publicar la web (perquè l'app vegi la llista nova)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radars-pages.yml
